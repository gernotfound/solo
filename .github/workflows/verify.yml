name: Verify SoLo
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: solo-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  domain-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks
        run: npm run check
      - name: Domain and world tests
        run: npm test
      - name: Build standalone game
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium Playwright
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Gameplay in Chromium
        run: python tests/browser.py
