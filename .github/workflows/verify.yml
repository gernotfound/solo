name: Verify SoLo
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: solo-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  domain-and-browser:
    name: Canonical Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks
        run: npm run check
      - name: Domain and world tests
        run: npm test
      - name: Benchmark route and water checks
        run: npm run benchmark
      - name: Build standalone game
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium Playwright
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Gameplay in Chromium
        run: python tests/browser.py
      - name: Browser frame-time profiling in Chromium
        run: npm run profile:browser
      - name: Upload browser performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solo-browser-performance
          path: artifacts/performance/chromium.json
          if-no-files-found: ignore
          retention-days: 14
